<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MiClub - Sistema integral de gestion de club de barrio: administracion de socios, cuotas sociales, pagos y asistencia deportiva.">
    <title>MiClub - Gestion de Club Social y Deportivo</title>

    <!-- Hojas de estilo del sistema -->
    <link rel="stylesheet" href="assets/css/tema.css?v=2">
    <link rel="stylesheet" href="assets/css/base.css?v=2">
    <link rel="stylesheet" href="assets/css/componentes.css?v=2">
</head>
<body>
    <!-- Contenedor flotante para notificaciones Toast -->
    <div id="contenedor-notificaciones" aria-live="polite"></div>

    <!-- Contenedor principal de la aplicacion de una sola pagina -->
    <div id="app-contenedor">
        <!-- Telon / Backdrop para navegacion movil -->
        <div id="telon-lateral" class="telon-lateral" aria-hidden="true"></div>

        <!-- Barra lateral institucional -->
        <aside id="barra-lateral" aria-label="Menu Principal">
            <div class="cabecera-lateral">
                <div class="icono-escudo" aria-hidden="true">MC</div>
                <div style="flex: 1; min-width: 0;">
                    <div class="titulo-club nombre-club-dinamico">MiClub</div>
                    <div class="subtitulo-club">Club Social y Deportivo</div>
                </div>
                <button type="button" class="btn-cerrar-lateral no-escritorio" id="btn-cerrar-lateral" aria-label="Cerrar menu">
                    &times;
                </button>
            </div>

            <!-- Navegacion por rol -->
            <nav style="flex: 1; display: flex; flex-direction: column; overflow-y: auto;">
                <ul class="menu-lateral" id="lista-menu-lateral"></ul>
            </nav>

            <!-- Pie de barra lateral con sesion activa -->
            <div class="pie-lateral" id="info-usuario-pie"></div>
        </aside>

        <!-- Area de contenido principal -->
        <div id="area-principal">
            <!-- Encabezado superior -->
            <header id="encabezado-superior">
                <div style="display: flex; align-items: center; gap: 0.75rem; min-width: 0;">
                    <button type="button" class="btn-menu-movil no-escritorio" id="btn-menu-movil" aria-label="Abrir menu de navegacion">
                        <svg class="icono-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                    </button>
                    <h1 class="titulo-vista-actual" id="titulo-vista">Panel Principal</h1>
                </div>
                <div class="subtitulo-encabezado" style="font-size: 0.85rem; color: var(--color-texto-suave);">
                    <span class="nombre-club-dinamico">Club Social y Deportivo MiClub</span>
                </div>
            </header>

            <!-- Contenido dinamico de la vista activa -->
            <main id="contenido-vista" role="main" tabindex="-1">
                <div style="text-align: center; padding: 3rem; color: var(--color-texto-suave);">
                    Cargando aplicacion...
                </div>
            </main>
        </div>
    </div>

    <!-- Modulos JavaScript en capas (sin dependencias externas ni compilacion) -->
    <script src="assets/js/api.js?v=3"></script>
    <script src="assets/js/ui.js?v=3"></script>
    <script src="assets/js/auth.js?v=3"></script>
    <script src="assets/js/tema.js?v=3"></script>
    <script src="assets/js/router.js?v=3"></script>
    
    <!-- Vistas del sistema -->
    <script src="assets/js/vistas/inicioSesion.js?v=3"></script>
    <script src="assets/js/vistas/panel.js?v=3"></script>
    <script src="assets/js/vistas/generarCuotas.js?v=3"></script>
    <script src="assets/js/vistas/registrarPago.js?v=3"></script>
    <script src="assets/js/vistas/recibo.js?v=3"></script>
    <script src="assets/js/vistas/asistencia.js?v=3"></script>
    <script src="assets/js/vistas/carnet.js?v=3"></script>
    <script src="assets/js/vistas/estadoCuenta.js?v=3"></script>
    <script src="assets/js/vistas/historialPagos.js?v=3"></script>
    <script src="assets/js/vistas/pagarCuota.js?v=3"></script>
    <script src="assets/js/vistas/inscripcionDivision.js?v=3"></script>
    <script src="assets/js/vistas/editarDatos.js?v=3"></script>
    <script src="assets/js/vistas/misEntrenamientos.js?v=3"></script>
    <script src="assets/js/vistas/morosos.js?v=3"></script>
    <script src="assets/js/vistas/plantel.js?v=3"></script>
    <script src="assets/js/vistas/crearEntrenamiento.js?v=3"></script>
    <script src="assets/js/vistas/apercibimientos.js?v=3"></script>
    <script src="assets/js/vistas/apariencia.js?v=3"></script>
    <script src="assets/js/vistas/usuarios.js?v=3"></script>
    <script src="assets/js/vistas/socios.js?v=3"></script>
    <script src="assets/js/vistas/categorias.js?v=3"></script>
    <script src="assets/js/vistas/precios.js?v=3"></script>
    <script src="assets/js/vistas/divisiones.js?v=3"></script>

    <!-- Bootstrap de inicio -->
    <script src="assets/js/app.js?v=3"></script>
</body>
</html>
